<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ШРИФТЫ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- БУТСТРАП -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- LEAFLET MAP CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- СТИЛИ -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/map-page.css" />

    <title>Уберу | Карта</title>
  </head>
  <body class="no-scroll">
    <!-- MAIN -->
    <main class="main">
      <section>
        <div class="container-fluid p-0">
          <!-- FULL SCREEN MAP -->
          <div id="fullMap"></div>
        </div>
      </section>
    </main>

    <!-- Overlay for popups -->
    <div id="popupOverlay" class="popup-overlay hidden"></div>

    <!-- Поп-ап карточка для красной метки -->
    <div id="popupCardRed" class="popup-card hidden">
      <button class="popup-close" id="popupCloseRed">&times;</button>
      <div class="popup-content">
        <h3 class="popup-title">
          Точка #<span id="pointNumberRed">0212</span>
        </h3>
        <p class="popup-status">
          Статус: <span class="status-text status-red">загрязнено</span>
        </p>
        <div class="popup-image">
          <img src="../img/mapclear/trash.png" alt="Загрязненное место" />
        </div>
        <button class="popup-btn" id="cleanBtnRed">Уберу</button>
      </div>
    </div>

    <!-- Поп-ап карточка для желтой метки -->
    <div id="popupCardYellow" class="popup-card hidden">
      <button class="popup-close" id="popupCloseYellow">&times;</button>
      <div class="popup-content">
        <h3 class="popup-title">
          Точка #<span id="pointNumberYellow">0345</span>
        </h3>
        <p class="popup-status">
          Статус: <span class="status-text status-yellow">на проверке</span>
        </p>
        <p class="popup-description">
          Подтвердите, что точка действительно убрана
        </p>
        <div class="photo-comparison">
          <div class="photo-item">
            <img src="../img/mapclear/trash.png" alt="До уборки" />
            <span class="photo-label">До уборки</span>
          </div>
          <div class="photo-item">
            <img src="../img/mapclear/clear.png" alt="После уборки" />
            <span class="photo-label">После уборки</span>
          </div>
        </div>
        <button class="popup-btn" id="cleanBtnYellow">Убрано</button>
      </div>
    </div>

    <!-- Поп-ап карточка для фотоотчета -->
    <div id="reportCard" class="popup-card hidden">
      <button class="popup-close" id="reportClose">&times;</button>
      <div class="popup-content">
        <h3 class="popup-title">Фотоотчет об уборке</h3>
        <p class="popup-description">
          Сделайте фото чистого места и загрузите его
        </p>
        <div class="upload-area">
          <label for="photoUpload" class="upload-label">
            <div class="upload-icon">📷</div>
            <span>Нажмите, чтобы сделать фото</span>
          </label>
          <input
            type="file"
            id="photoUpload"
            accept="image/*"
            capture="camera"
            hidden
          />
        </div>
        <button class="popup-btn submit-btn" id="submitReport">
          Отправить отчет
        </button>
      </div>
    </div>

    <!-- Мобильная навигация -->
    <nav class="mobile-nav">
      <a href="#" class="nav-item icon-trash" aria-label="Удалить"></a>
      <a
        href="learn.html"
        class="nav-item icon-lightbulb"
        aria-label="Идеи"
      ></a>

      <!-- Центральная кнопка -->
      <a href="map.html" class="center-btn active" aria-label="Карта">
        <svg viewBox="0 0 24 24">
          <path
            d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"
          />
        </svg>
      </a>

      <a
        href="socials.html"
        class="nav-item icon-info"
        aria-label="Информация"
      ></a>
      <a href="#" class="nav-item icon-user" aria-label="Профиль"></a>
    </nav>
  </body>

  <!-- LEAFLET MAP JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script src="../js/map.js"></script>
</html>
