<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ШРИФТЫ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- БУТСТРАП -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- LEAFLET MAP CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- СТИЛИ -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tasks.css" />
    <title>Уберу | Задания</title>
  </head>
  <body>
    <main class="main">
      <section>
        <div class="container">
          <!-- Header -->
          <div class="header">
            <div class="back-button">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
              </svg>
            </div>
            <h1 class="page-title">Задания</h1>
          </div>

          <!-- Segmented Control -->
          <div class="segmented-control">
            <div class="segment active">Выполненные</div>
            <div class="segment">Новые</div>
            <div class="segment">Отклоненные</div>
          </div>

          <!-- Cards Grid -->
          <div class="cards-grid">
            <!-- Card 1 - Blue -->
            <div class="card blue">
              <div class="date-badge">2 дня</div>
              <h3 class="card-title">Убрать одну точку</h3>
              <div class="card-image">
                <img src="../img/tasks_page/hand.png" alt="Bottle" />
              </div>
              <button class="eco-points-button">20 эко-баллов</button>
            </div>

            <!-- Card 2 - Yellow -->
            <div class="card yellow">
              <div class="date-badge">1 месяц</div>
              <h3 class="card-title">Убрать восемь точек</h3>
              <div class="card-image">
                <img src="../img/tasks_page/hands.png" alt="Trash" />
              </div>
              <button class="eco-points-button">65 эко-баллов</button>
            </div>

            <!-- Card 3 - Yellow -->
            <div class="card yellow">
              <div class="date-badge">1 день</div>
              <h3 class="card-title">Купить один товар в магазине</h3>
              <div class="card-image">
                <img src="../img/tasks_page/tshort.png" alt="T-shirt" />
              </div>
              <button class="eco-points-button">15 эко-баллов</button>
            </div>

            <!-- Card 4 - Green -->
            <div class="card green">
              <div class="date-badge">8 часов</div>
              <h3 class="card-title">Купить один товар в магазине</h3>
              <div class="card-image">
                <img src="../img/tasks_page/bag.png" alt="Shopping bag" />
              </div>
              <button class="eco-points-button">65 эко-баллов</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
