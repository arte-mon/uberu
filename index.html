<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ШРИФТЫ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- БУТСТРАП -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- СТИЛИ -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/main-page-2.css" />

    <title>FORMA</title>
  </head>
  <body>
    <!-- MAIN -->
    <main class="main">
      <section>
        <div class="container">
          <h1>Привет, Пользователь</h1>

          <!-- MAP -->
          <div class="card map-card">
            <img
              src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1200"
            />

            <div class="tag">Пункты сортировки</div>
          </div>

          <!-- CO2 -->
          <div class="card carbon-card">
            <div class="carbon-text">
              <h3 class="big-card-title mb-2">1487 граммов</h3>
              <p>выбросов CO2 предотвращено благодаря Вам!</p>
            </div>

            <img src="img/main_page/gloves.png" />
          </div>

          <!-- GRID -->
          <div class="grid">
            <div class="card left-big">
              <div class="left-big-text">
                <p>Переработано</p>
                <h3>11.8 кг мусора</h3>
              </div>
              <img src="img/main_page/recycling.png" />
            </div>

            <div class="right-column">
              <div class="card small-green">
                <p>Всего</p>
                <h3>12538 очков</h3>
                <!-- <h3>очков</h3> -->
              </div>

              <div class="card small-yellow">
                <div class="small-text">
                  <h3>Подробнее</h3>
                </div>
                <img src="img/main_page/more.png" />
              </div>
            </div>
          </div>

          <!-- PLANET -->
          <div class="card planet-card">
            <img
              src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200"
            />

            <div class="content">
              <h3>Ваша планета</h3>
            </div>

            <div class="tag">Доступно обновление</div>
          </div>

          <!-- DOUBLE -->
          <div class="double-grid">
            <div class="card yellow-card">
              <h3>Руководство по сортировке</h3>
              <img src="img/main_page/guide.png" />
            </div>

            <div class="card orange-card">
              <h3>Задания</h3>
              <img src="img/main_page/tasks.png" />
            </div>
          </div>

          <!-- ACTIVITY -->
          <h2 class="section-title">Активность</h2>

          <div class="activity-grid">
            <div class="card activity-big">
              <img
                src="https://images.unsplash.com/photo-1528323273322-d81458248d40?q=80&w=1200"
              />

              <div class="tag">Стань волонтером</div>
            </div>

            <div class="card activity-small">
              <img
                src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?q=80&w=1200"
              />

              <div class="tag">Принеси одежду</div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- FOOTER -->
  </body>

  <script src="js/script.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
